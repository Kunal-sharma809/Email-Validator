<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Validator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav>
            <div class="logo">iValidate</div>
            <ul>
                <li><a href="/">Home</a></li>
                <li><a href="/">About</a></li>
                <li><a href="/">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="container">
            <h1>Enter your Email validate</h1>
            <form action="">
                <input id="user" type="text" placeholder="Enter username">
                <input id="email" type="email" placeholder="Enter your email">
                <input id="submit" type="submit">
            </form>
        </div>

        <div class="result-container">
            <h2>Email Validation Status</h2>
            <div id="resultStatus">
                Your results will show here
            </div>
        </div>
    </main>

    <footer>
        Copyright &copy; 2026 | iValidate.com | All Rights Reserved
    </footer>

    <script src="script.js"></script>
</body>
</html>
